<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Signo Zodiacal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #2d3436;
            margin-bottom: 25px;
        }
        label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 5px;
            color: #636e72;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            border-color: #0984e3;
        }
        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #74b9ff;
        }
        #resultado {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #2d3436;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Calculadora Zodiacal</h2>
        
        <label for="mes">Mes de nacimiento:</label>
        <select id="mes">
            <option value="enero">Enero</option>
            <option value="febrero">Febrero</option>
            <option value="marzo">Marzo</option>
            <option value="abril">Abril</option>
            <option value="mayo">Mayo</option>
            <option value="junio">Junio</option>
            <option value="julio">Julio</option>
            <option value="agosto">Agosto</option>
            <option value="septiembre">Septiembre</option>
            <option value="octubre">Octubre</option>
            <option value="noviembre">Noviembre</option>
            <option value="diciembre">Diciembre</option>
        </select>
        
        <label for="dia">Día de nacimiento:</label>
        <input type="number" id="dia" min="1" max="31" placeholder="Ej. 15">
        
        <button onclick="calcularSigno()">Descubrir mi signo</button>
        
        <div id="resultado"></div>
    </div>

    <script>
        function calcularSigno() {
            let mes = document.getElementById('mes').value;
            let dia = parseInt(document.getElementById('dia').value);
            let resultadoDiv = document.getElementById('resultado');

            if (!dia || isNaN(dia) || dia < 1 || dia > 31) {
                resultadoDiv.style.color = "#d63031";
                resultadoDiv.innerText = "Por favor, ingresa un día válido.";
                return;
            }

            let signo = "Fecha no válida";

            if ((mes === "enero" && dia >= 20) || (mes === "febrero" && dia <= 18)) signo = "Acuario ♒";
            else if ((mes === "febrero" && dia >= 19) || (mes === "marzo" && dia <= 20)) signo = "Piscis ♓";
            else if ((mes === "marzo" && dia >= 21) || (mes === "abril" && dia <= 19)) signo = "Aries ♈";
            else if ((mes === "abril" && dia >= 20) || (mes === "mayo" && dia <= 20)) signo = "Tauro ♉";
            else if ((mes === "mayo" && dia >= 21) || (mes === "junio" && dia <= 20)) signo = "Géminis ♊";
            else if ((mes === "junio" && dia >= 21) || (mes === "julio" && dia <= 22)) signo = "Cáncer ♋";
            else if ((mes === "julio" && dia >= 23) || (mes === "agosto" && dia <= 22)) signo = "Leo ♌";
            else if ((mes === "agosto" && dia >= 23) || (mes === "septiembre" && dia <= 22)) signo = "Virgo ♍";
            else if ((mes === "septiembre" && dia >= 23) || (mes === "octubre" && dia <= 22)) signo = "Libra ♎";
            else if ((mes === "octubre" && dia >= 23) || (mes === "noviembre" && dia <= 21)) signo = "Escorpio ♏";
            else if ((mes === "noviembre" && dia >= 22) || (mes === "diciembre" && dia <= 21)) signo = "Sagitario ♐";
            else if ((mes === "diciembre" && dia >= 22) || (mes === "enero" && dia <= 19)) signo = "Capricornio ♑";

            resultadoDiv.style.color = "#0984e3";
            resultadoDiv.innerText = "Tu signo es: " + signo;
        }
    </script>

</body>
</html>
